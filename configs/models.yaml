# Evaluated routes. One route = one model behind one Azure API path and one setting.
#
# - Endpoint values come from environment variables (see configs/endpoints.env.example).
#   Do not write real endpoints in this file: the repository is public.
# - Authentication is Microsoft Entra ID (az login). Keys are not used.
# - `params` keys listed in adapters/base.py NON_SIGNATURE_PARAMS (timeouts, retries, concurrency,
#   min_interval_s) do not change the cache key. Every other param does.
# - `live_verified`: date a one-utterance live call returned a transcript. null = not called yet.
# - `price_usd_per_audio_hour`: null until a price is confirmed; reports show "미설정".

defaults:
  price_usd_per_audio_hour: null
  params:
    timeout_s: 120
    connect_timeout_s: 30
    max_retries: 4
    concurrency: 4

templates:
  realtime: &realtime
    concurrency: 2
    chunk_ms: 20
    final_timeout_s: 60
    vad_flush_after_s: 3.0

models:
  # ---------------- Track A: file transcription ----------------
  fast-azure:
    adapter: fast
    track: A
    region: koreacentral
    model_id: azure-transcribe
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_SPEECH_KOREACENTRAL_ENDPOINT}
      definition: {locales: [ko-KR]}

  fast-llm:
    adapter: fast
    track: A
    region: eastus
    model_id: llm-speech
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_SPEECH_EASTUS_ENDPOINT}
      definition: {locales: [ko-KR], enhancedMode: {enabled: true, task: transcribe}}

  fast-mai2:
    adapter: fast
    track: A
    region: eastus
    model_id: MAI-Transcribe-2
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_SPEECH_EASTUS_ENDPOINT}
      definition: {locales: [ko], enhancedMode: {enabled: true, model: MAI-Transcribe-2}}

  fast-mai15:
    adapter: fast
    track: A
    region: eastus
    model_id: MAI-Transcribe-1.5
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_SPEECH_EASTUS_ENDPOINT}
      definition: {locales: [ko], enhancedMode: {enabled: true, model: MAI-Transcribe-1.5}}

  aoai-whisper:
    adapter: openai_file
    track: A
    region: eastus2
    model_id: whisper
    live_verified: "2026-11-03"
    notes: "Standard capacity 3 (about 3 requests/min). Requests are spaced by min_interval_s."
    params:
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-whisper
      concurrency: 1
      min_interval_s: 21
      max_retries: 6
      form: {language: ko, temperature: 0}

  aoai-gpt-transcribe:
    adapter: openai_file
    track: A
    region: eastus2
    model_id: gpt-transcribe
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-transcribe
      concurrency: 2
      form: {language: ko, temperature: 0}

  aoai-gpt-4o-transcribe:
    adapter: openai_file
    track: A
    region: eastus2
    model_id: gpt-4o-transcribe
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-4o-transcribe
      form: {language: ko, temperature: 0}

  aoai-gpt-4o-mini-transcribe:
    adapter: openai_file
    track: A
    region: eastus2
    model_id: gpt-4o-mini-transcribe
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-4o-mini-transcribe
      form: {language: ko, temperature: 0}

  aoai-gpt-4o-transcribe-diarize:
    adapter: openai_file
    track: A
    region: eastus2
    model_id: gpt-4o-transcribe-diarize
    live_verified: "2026-11-03"
    notes: "Probe returned non-Korean (English/romanized) text. Check hangul_ratio."
    params:
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-4o-transcribe-diarize
      form: {language: ko, chunking_strategy: auto}

  # ---------------- Track B: real-time streaming (audio sent at 1x) ----------------
  sdk-azure:
    adapter: speech_sdk
    track: B
    region: koreacentral
    model_id: azure-transcribe
    live_verified: "2026-11-03"
    params:
      endpoint: ${KSTT_SPEECH_KOREACENTRAL_ENDPOINT}
      language: ko-KR
      concurrency: 2
      chunk_ms: 20
      final_timeout_s: 60

  mai-rt:
    adapter: mai_realtime
    track: B
    region: eastus2
    model_id: MAI-Transcribe-2-Streaming
    live_verified: "2026-11-03"
    params:
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      deployment: ${KSTT_MAI_STREAMING_DEPLOYMENT}
      language: ko
      mode: commit

  aoai-rt-live:
    adapter: openai_realtime
    track: B
    region: eastus2
    model_id: gpt-live-transcribe
    live_verified: "2026-11-03"
    params:
      <<: *realtime
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-live-transcribe
      language: ko
      mode: commit

  aoai-rt-live-vad:
    adapter: openai_realtime
    track: B
    region: eastus2
    model_id: gpt-live-transcribe
    live_verified: "2026-11-03"
    params:
      <<: *realtime
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-live-transcribe
      language: ko
      mode: vad
      trailing_silence_s: 1.0

  aoai-rt-whisper:
    adapter: openai_realtime
    track: B
    region: eastus2
    model_id: gpt-realtime-whisper
    live_verified: "2026-11-03"
    params:
      <<: *realtime
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-realtime-whisper
      language: ko
      mode: commit

  aoai-rt-whisper-vad:
    adapter: openai_realtime
    track: B
    region: eastus2
    model_id: gpt-realtime-whisper
    live_verified: "2026-11-03"
    params:
      <<: *realtime
      endpoint: ${KSTT_AOAI_ENDPOINT}
      deployment: kstt-gpt-realtime-whisper
      language: ko
      mode: vad
      trailing_silence_s: 1.0

  # Voice Live: input-audio transcription only (response.create is never sent).
  # chat_model is the session model required by the URL; it does not transcribe.
  vl-azure-speech:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: azure-speech
    live_verified: "2026-11-03"
    params: &vl_azure_speech
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-4.1-mini
      transcription_model: azure-speech
      language: ko
      mode: commit

  vl-azure-speech-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: azure-speech
    live_verified: "2026-11-03"
    params:
      <<: *vl_azure_speech
      mode: vad
      trailing_silence_s: 1.0

  vl-mai-transcribe-2:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: mai-transcribe-2
    live_verified: "2026-11-03"
    params: &vl_mai2
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-4.1-mini
      transcription_model: mai-transcribe-2
      language: ko
      mode: commit

  vl-mai-transcribe-2-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: mai-transcribe-2
    live_verified: null
    params:
      <<: *vl_mai2
      mode: vad
      trailing_silence_s: 1.0

  vl-mai-transcribe-2-streaming:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: mai-transcribe-2-streaming
    live_verified: "2026-11-03"
    params: &vl_mai2s
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-4.1-mini
      transcription_model: mai-transcribe-2-streaming
      language: ko
      mode: commit

  vl-mai-transcribe-2-streaming-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: mai-transcribe-2-streaming
    live_verified: "2026-11-03"
    params:
      <<: *vl_mai2s
      mode: vad
      trailing_silence_s: 1.0

  vl-whisper-1:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: whisper-1
    live_verified: "2026-11-03"
    params: &vl_whisper
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-realtime-mini
      transcription_model: whisper-1
      language: ko
      mode: commit

  vl-whisper-1-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: whisper-1
    live_verified: null
    params:
      <<: *vl_whisper
      mode: vad
      trailing_silence_s: 1.0

  vl-gpt-4o-transcribe:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-transcribe
    live_verified: "2026-11-03"
    params: &vl_4o
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-realtime-mini
      transcription_model: gpt-4o-transcribe
      language: ko
      mode: commit

  vl-gpt-4o-transcribe-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-transcribe
    live_verified: null
    params:
      <<: *vl_4o
      mode: vad
      trailing_silence_s: 1.0

  vl-gpt-4o-mini-transcribe:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-mini-transcribe
    live_verified: "2026-11-03"
    params: &vl_4o_mini
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-realtime-mini
      transcription_model: gpt-4o-mini-transcribe
      language: ko
      mode: commit

  vl-gpt-4o-mini-transcribe-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-mini-transcribe
    live_verified: "2026-11-03"
    params:
      <<: *vl_4o_mini
      mode: vad
      trailing_silence_s: 1.0

  vl-gpt-4o-transcribe-diarize:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-transcribe-diarize
    live_verified: "2026-11-03"
    notes: "Probe returned non-Korean (English/romanized) text. Check hangul_ratio."
    params: &vl_diarize
      <<: *realtime
      ai_host: ${KSTT_AI_SERVICES_HOST}
      chat_model: gpt-realtime-mini
      transcription_model: gpt-4o-transcribe-diarize
      language: ko
      mode: commit

  vl-gpt-4o-transcribe-diarize-vad:
    adapter: voicelive
    track: B
    region: eastus2
    model_id: gpt-4o-transcribe-diarize
    live_verified: null
    notes: "Probe (commit mode) returned non-Korean text. Check hangul_ratio."
    params:
      <<: *vl_diarize
      mode: vad
      trailing_silence_s: 1.0
