[project]
name = "kstt-eval"
version = "0.1.0"
description = "Evaluation harness for Korean speech-to-text models on Azure (KsponSpeech eval sets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "scipy>=1.13",
    "soundfile>=0.12",
    "websockets>=14",
]

[project.optional-dependencies]
speech-sdk = ["azure-cognitiveservices-speech>=1.44"]

[project.scripts]
kstt = "kstt_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kstt_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
